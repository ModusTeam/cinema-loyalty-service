# Verified against the public SonarQube Cloud component API.
# Automatic Analysis currently ignores this file. See README activation steps.
sonar.projectKey=ModusTeam_cinema-loyalty-service
sonar.organization=modusteam
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Include maintained schema, migrations and infrastructure alongside application code.
sonar.sources=src,prisma,.github,Dockerfile,prisma.config.ts
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**
sonar.exclusions=src/**/*.spec.ts,src/generated/prisma/**

# Produced by existing unit/integration runs; no gate thresholds are overridden.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
