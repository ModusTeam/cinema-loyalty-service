name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun x --no-install prisma generate
      - run: bun run lint
      - run: bun run build
      - run: bun run test:cov --runInBand
      - run: bun run test:integration
      - run: bun run test:rmq
      - name: Build production image (no push)
        run: docker build --tag cinema-loyalty-service:ci .
      # Enable only after disabling SonarQube Cloud Automatic Analysis.
      # Fork and Dependabot PRs keep all test gates but receive no Sonar token.
      - name: SonarQube Cloud analysis and Quality Gate
        if: >-
          ${{ vars.SONAR_CI_ENABLED == 'true' &&
              github.actor != 'dependabot[bot]' &&
              (github.event_name == 'push' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
